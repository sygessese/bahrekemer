# Cloudflare Worker for the bahrekemer editor — see editor/README.md
name = "bahrekemer-editor"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
REPO = "sygessese/bahrekemer"
BRANCH = "dad-edits"
ORIGINS = "https://bahrekemer.com,https://www.bahrekemer.com"

# At most 5 password tries a minute from one place.
[[ratelimits]]
name = "LOGIN_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Secrets (never in this file):  npx wrangler secret put EDIT_PASSWORD | SESSION_SECRET | GITHUB_TOKEN
