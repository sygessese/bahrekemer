<div lang="am">
  <p>ይህ የቅኔ ገጽ ኪነ ጥበባት በኢትዮጵያ መቸ ከሚለው መጽሐፍ ገጽ የቀጠለ ነው፡፡ በየሳምንቱ ቅዳሜ ይቀርባል፡፡</p>

<div lang="en">
  <p>This page of Qene continues from the pages of the book <cite>The Arts in Ethiopia — Since When?</cite> It appears every Saturday.</p>
